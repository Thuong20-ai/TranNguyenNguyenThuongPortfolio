<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tran Nguyen Nguyen Thuong | Digital Marketing Portfolio</title>
<meta name="description" content="Interactive portfolio of Tran Nguyen Nguyen Thuong, Digital Marketing student at RMIT. 17 projects across e-commerce, UI/UX and content for Routine, Timezone Vietnam and MCV.">
<meta name="theme-color" content="#4F6FFF">
<meta property="og:type" content="website">
<meta property="og:title" content="Tran Nguyen Nguyen Thuong | Digital Marketing Portfolio">
<meta property="og:description" content="A playful desktop-style portfolio: open the folders, take the tour, browse 17 projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&family=Silkscreen:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  /* layout idea: a playful desktop OS. wallpaper + folder icons + draggable windows + taskbar; a 5-step guided tour runs along the bottom */
  --sky:#4F6FFF; --lime:#C1F469; --sun:#FFDB41; --deep:#2D49C5; --navy:#2039A7; --grape:#672DC5; --teal:#2D97C5;
  --ink:#2A2525; --paper:#FBFDFE; --bar:rgba(42,37,37,.42);
  --display:"Yellowtail","Brush Script MT",cursive; --label:"Poppins","Arial Black",sans-serif;
  --body:"Inter",system-ui,sans-serif; --pixel:"Silkscreen","Courier New",monospace;
  --barh:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}

/* ---------- wallpaper ---------- */
#desk{position:fixed;inset:0;overflow:hidden;background:var(--sky)}
.cloud{position:absolute;width:min(46vw,620px);opacity:.92;animation:drift 70s linear infinite;will-change:transform}
.cloud.c1{top:6%;left:-10%}
.cloud.c2{top:30%;left:-40%;width:min(30vw,380px);animation-duration:95s;animation-delay:-40s;opacity:.7}
.cloud.c3{top:14%;left:-30%;width:min(24vw,300px);animation-duration:120s;animation-delay:-80s;opacity:.6}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(160vw)}}
.grass{position:absolute;left:0;right:0;bottom:var(--barh);height:24vh;min-height:120px;background:url(grass.webp) center top/cover}
.wordmark{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%) rotate(-3deg);text-align:center;pointer-events:none;white-space:nowrap}
.wordmark b{display:block;font:400 clamp(72px,15vw,220px)/.9 var(--display);color:var(--sun)}
.wordmark i{display:block;font:400 clamp(26px,4.4vw,64px)/1 var(--display);color:var(--paper);margin-top:-.1em}
.wordmark span{font:400 clamp(20px,3vw,44px)/1 var(--display);color:var(--paper);display:block;margin-bottom:-.15em;margin-right:38%}
#cat{position:absolute;right:max(6vw,24px);bottom:calc(var(--barh) + 3vh);width:clamp(120px,15vw,220px);transform-origin:50% 100%;transition:transform .25s}
#cat:hover{transform:rotate(-3deg) scale(1.04)}
#cat.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-22px) rotate(4deg)}}
#meow{position:absolute;right:calc(max(6vw,24px) + clamp(110px,13vw,200px));bottom:calc(var(--barh) + 3vh + clamp(120px,15vw,220px));max-width:240px;background:var(--paper);border:3px solid var(--ink);border-radius:18px 18px 4px 18px;padding:10px 14px;font:600 14px/1.35 var(--body);box-shadow:5px 5px 0 var(--ink);opacity:0;transform:translateY(8px) scale(.96);transition:.25s;pointer-events:none;z-index:45}
#cat{z-index:44}
#meow.on{opacity:1;transform:none}
.spark{position:absolute;width:70px;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.8) rotate(12deg);opacity:.6}}

/* ---------- desktop icons ---------- */
#icons{position:absolute;left:18px;top:18px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:10px 14px;z-index:2}
.ico{width:104px;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--paper);font:600 13px/1.2 var(--body);text-align:center;transition:background .15s,transform .15s}
.ico:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.ico:active{transform:scale(.95)}
.ico svg{width:54px;height:46px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.ico.tour svg{height:54px}
.ico.tour{color:var(--sun)}

/* ---------- windows ---------- */
#wins{position:absolute;inset:0 0 var(--barh) 0;pointer-events:none;z-index:5}
.win{position:absolute;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 rgba(32,57,167,.55);pointer-events:auto;min-width:280px;max-width:calc(100vw - 16px);max-height:calc(100% - 12px);overflow:hidden;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
.win.closing{animation:shut .18s ease-in forwards}
.win.front{box-shadow:10px 10px 0 var(--navy)}
@keyframes pop{from{transform:scale(.82) translateY(24px);opacity:0}}
@keyframes shut{to{transform:scale(.86) translateY(20px);opacity:0}}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--win,var(--sun));border-bottom:3px solid var(--ink);cursor:grab;user-select:none;touch-action:none;flex:none}
.bar:active{cursor:grabbing}
.bar h2{font:700 13px/1 var(--pixel);letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--barink,var(--ink))}
.bar button{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);font:700 14px/1 var(--pixel);display:grid;place-items:center}
.bar button:hover{background:var(--ink);color:var(--paper)}
.body{overflow:auto;padding:22px 24px 26px;flex:1}
.script{font-family:var(--display);font-weight:400;line-height:.95}
.h-script{font:400 clamp(44px,6vw,72px)/.9 var(--display);color:var(--deep);transform:rotate(-2deg);transform-origin:left;margin-bottom:6px}
.sub-script{font:400 26px/1 var(--display);color:var(--sky);margin:0 0 18px 6px}
.lab{font:700 15px/1.2 var(--label);color:var(--navy);text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin:18px 0 4px}
.lab::before{content:"";width:18px;height:19px;flex:none;background:currentColor;clip-path:polygon(50% 0,54% 39%,81% 10%,60% 43%,100% 35%,62% 50%,100% 65%,60% 57%,81% 90%,54% 61%,50% 100%,46% 61%,19% 90%,40% 57%,0 65%,38% 50%,0 35%,40% 43%,19% 10%,46% 39%)}
.pill{display:inline-block;padding:7px 16px;border-radius:999px;border:3px solid var(--lime);background:var(--grape);color:var(--sun);font:700 12.5px/1.2 var(--body);letter-spacing:.03em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--paper);border:3px solid var(--ink);font:700 14px/1 var(--label);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--sun)}
.btn.sm{padding:7px 14px;font-size:12px;box-shadow:3px 3px 0 var(--ink)}

/* about */
.about{display:grid;grid-template-columns:1fr 210px;gap:20px;align-items:end}
.about img{width:210px;animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(2deg)}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.fact{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--lime)}
.fact:nth-child(2){background:var(--sun)}.fact:nth-child(3){background:var(--sky);color:var(--paper)}
.fact b{display:block;font:700 26px/1 var(--label)}
.fact span{font-size:12.5px;line-height:1.25;display:block;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.skill{padding:14px 20px;border:4px solid var(--lime);color:var(--sun);font:700 15px/1.15 var(--body);text-transform:uppercase;text-align:center;max-width:230px;transition:transform .18s;animation:bob 4s ease-in-out infinite}
.skill:nth-child(3n+1){background:var(--deep);border-radius:50%;padding:20px 26px;transform:rotate(-3deg)}
.skill:nth-child(3n+2){background:var(--grape);border-radius:22px}
.skill:nth-child(3n){background:var(--teal);border-radius:26px;color:#fff}
.skill:nth-child(2n){animation-delay:-2s}
.skill:hover{transform:scale(1.08) rotate(2deg);animation-play-state:paused}
@keyframes bob{50%{translate:0 -5px}}
.hint{font-size:13.5px;color:#55607a;margin-top:16px}

/* experience journey */
.road{position:relative;margin:14px 0 0 12px;padding-left:34px}
.road::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--deep) 0 10px,transparent 10px 18px)}
.stop{position:relative;padding:0 0 18px;opacity:0;transform:translateX(14px);animation:arrive .5s forwards}
@keyframes arrive{to{opacity:1;transform:none}}
.stop::before{content:attr(data-n);position:absolute;left:-38px;top:0;width:30px;height:30px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);font:700 13px/24px var(--pixel);text-align:center}
.stop.now::before{background:var(--lime);box-shadow:0 0 0 6px rgba(193,244,105,.5)}
.stop button{display:block;text-align:left;width:100%}
.stop h3{font:700 15px/1.25 var(--label);color:var(--navy);text-transform:uppercase}
.stop small{font:600 12.5px var(--body);color:var(--grape)}
.stop p{font-size:14.5px;max-height:0;overflow:hidden;transition:max-height .35s ease,margin .35s}
.stop.open p{max-height:160px;margin-top:6px}
.stop h3::after{content:" +";color:var(--sky)}
.stop.open h3::after{content:" −"}

/* projects explorer */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chip{padding:6px 14px;border-radius:999px;border:2.5px solid var(--ink);font:700 12.5px/1 var(--body);background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.file{text-align:left;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.file:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:6px 6px 0 var(--sky)}
.file img{aspect-ratio:16/10;object-fit:cover;object-position:top;width:100%;border-bottom:3px solid var(--ink);background:#eee}
.file div{padding:9px 11px 11px}
.file b{font:700 13.5px/1.2 var(--body);display:block}
.file span{font:400 15px/1 var(--display);color:var(--deep)}
.file em{font:700 10px/1 var(--body);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--grape);display:block;margin-top:5px}
.empty{font-size:14px;color:#55607a;padding:20px 0}

/* project viewer */
.view{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.laptop{background:#000;border:10px solid #000;border-radius:16px 16px 0 0;outline:3px solid #969696;position:relative}
.laptop img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;transition:opacity .2s}
.base{height:16px;background:#969696;border-radius:0 0 14px 14px;margin:3px -5% 0;position:relative}
.base::after{content:"";position:absolute;left:44%;right:44%;top:0;height:6px;background:#727171;border-radius:0 0 6px 6px}
.thumbs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.thumbs button{width:74px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;opacity:.6;transition:.15s}
.thumbs button[aria-current="true"],.thumbs button:hover{opacity:1;transform:translateY(-3px);box-shadow:0 3px 0 var(--sky)}
.thumbs img{aspect-ratio:16/10;object-fit:cover;object-position:top}
.pnum{font:400 34px/1 var(--display);color:var(--sky)}
.view h3{font:400 clamp(38px,4.6vw,58px)/.92 var(--display);color:var(--deep);margin:2px 0 12px;text-wrap:balance}
.view p{font-size:15px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}

/* contact */
.contact{text-align:center;background:var(--sky) url(grass.webp) bottom/100% 34% no-repeat;color:var(--paper);padding-bottom:150px;position:relative}
.contact .big{font:400 clamp(60px,9vw,110px)/.9 var(--display);color:var(--sun);transform:rotate(-3deg)}
.contact .sm{font:400 30px/1 var(--display);margin-bottom:22px}
.line{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.line code{font:700 15px/1 var(--body);background:var(--navy);border:3px solid var(--lime);border-radius:999px;padding:10px 18px;color:var(--paper);overflow-wrap:anywhere}
.contact img{position:absolute;left:50%;bottom:6px;width:210px;transform:translateX(-50%)}

/* ---------- tour ---------- */
#tour{position:absolute;left:50%;bottom:calc(var(--barh) + 12px);transform:translateX(-50%);z-index:40;width:min(680px,calc(100vw - 24px));background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:12px 14px;display:none;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
#tour.on{display:grid;animation:pop .3s}
#tour img{width:52px;grid-row:span 2}
#tour p{font:600 14.5px/1.35 var(--body)}
#tour p b{font:400 24px/1 var(--display);color:var(--deep);margin-right:6px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);font:700 12px/1 var(--pixel);background:var(--paper)}
.steps .dot[aria-current="step"]{background:var(--sun);transform:scale(1.15)}
.steps .dot.done{background:var(--lime)}
.steps .sp{flex:1}

/* ---------- taskbar ---------- */
#task{position:fixed;left:0;right:0;bottom:0;height:var(--barh);background:var(--bar);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:50;color:var(--paper)}
#start{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
#start:hover,#start[aria-expanded="true"]{background:rgba(255,255,255,.22)}
#start i{display:block;width:26px;height:4px;border-radius:3px;background:var(--paper);box-shadow:0 8px 0 var(--paper),0 -8px 0 var(--paper)}
#search{display:flex;align-items:center;gap:8px;border:3px solid var(--paper);border-radius:999px;padding:0 14px;height:42px;width:min(260px,30vw)}
#search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--paper);font:600 14px var(--body)}
#search input::placeholder{color:rgba(255,255,255,.75)}
#tabs{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
#tabs button{font:700 11px/1 var(--pixel);padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
#tabs button.act{background:var(--sun);color:var(--ink)}
#clock{text-align:right;font:400 14px/1.15 var(--body);font-variant-numeric:tabular-nums}
#menu{position:fixed;left:14px;bottom:calc(var(--barh) + 10px);z-index:60;width:230px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:8px;display:none}
#menu.on{display:block;animation:pop .2s}
#menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font:700 13px var(--pixel);text-align:left}
#menu button:hover{background:var(--sun)}
#menu button span{width:22px;text-align:center;font-family:var(--body)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:100;background:var(--navy);color:var(--paper);display:grid;place-items:center;text-align:center;transition:opacity .5s,visibility .5s}
#boot.off{opacity:0;visibility:hidden}
#boot b{font:400 clamp(64px,12vw,140px)/1 var(--display);color:var(--sun);display:block;transform:rotate(-3deg)}
#boot span{font:700 13px var(--pixel);letter-spacing:.08em;display:block;margin-top:18px}
#boot .load{width:240px;height:18px;border:3px solid var(--paper);border-radius:10px;margin:18px auto 0;padding:2px}
#boot .load i{display:block;height:100%;width:0;background:var(--lime);border-radius:6px;animation:fill 1.3s ease-out forwards}
@keyframes fill{to{width:100%}}

/* ---------- small screens ---------- */
@media (max-width:760px){
  :root{--barh:58px}
  #icons{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-template-rows:none;left:8px;right:8px;top:10px;gap:4px}
  .ico{width:auto}
  .wordmark{top:47%}
  .win{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100% - 16px)!important}
  .about,.view{grid-template-columns:1fr}
  .about img{width:150px;margin:auto}
  .facts{grid-template-columns:1fr 1fr 1fr}
  #tabs{display:none}
  #search{flex:1;width:auto}
  .body{padding:18px 16px 22px}
  #cat{width:110px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .stop{opacity:1;transform:none}
}
</style>
</head>
<body>

<div id="boot" aria-hidden="true"><div><b>thuong.os</b><span>LOADING CREATIVE PORTFOLIO 2026</span><div class="load"><i></i></div></div></div>

<main id="desk">
  <img class="cloud c1" src="cloud.webp" alt="">
  <img class="cloud c2" src="cloud.webp" alt="">
  <img class="cloud c3" src="cloud.webp" alt="">
  <div class="wordmark" aria-hidden="true"><span>creative</span><b>Portfolio</b><i>Tran Nguyen Nguyen Thuong · 2026</i></div>
  <div class="grass"></div>
  <button id="cat" aria-label="Pet the cat"><img src="cat.webp" alt="A white cat sitting on the grass"></button>
  <div id="meow" role="status"></div>

  <nav id="icons" aria-label="Desktop"></nav>
  <div id="wins"></div>

  <div id="tour" role="region" aria-label="Guided tour">
    <img src="cat.webp" alt="">
    <p id="tourtxt"></p>
    <div class="steps" id="toursteps"></div>
  </div>
</main>

<div id="menu" role="menu"></div>
<footer id="task">
  <button id="start" aria-label="Open menu" aria-expanded="false"><i></i></button>
  <label id="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M15.5 15.5 21 21"/></svg><input id="q" type="search" placeholder="Search projects" autocomplete="off" aria-label="Search projects"></label>
  <div id="tabs"></div>
  <div id="clock" aria-label="Clock"></div>
</footer>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)}, el=function(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
var small=function(){return window.innerWidth<=760};

/* ---------------- content ---------------- */
var SKILLS=[["dm","Digital marketing & campaign support"],["ux","UX research & website optimization"],["ecom","E-commerce content management"],["research","Market research & consumer insights"],["ui","UI design & user flows"],["data","Data analysis & reporting"],["content","Creative content production"],["ai","AI-assisted visual creation"]];
var P=[
 {n:17,t:"Homepage Redesign",who:"for Routine",g:"routine",live:1,st:"Live website project",imgs:4,sk:["ui","ux","ecom"],link:"https://routine.vn/#new-user",
  b:[["The brief","Rework the Routine homepage on the structure of a global fashion retailer's site, using only Routine's own imagery."],["What I did","Designed the new homepage layout: a campaign hero, a category shortcut row, product carousels with promo labels and colour swatches, and editorial banners for each collection."],["Outcome","Live now on routine.vn, currently carrying the Black Friday campaign."]]},
 {n:9,t:"Women Style Guide",who:"for Routine",g:"routine",live:1,st:"Live website project",imgs:4,sk:["ui","ux","content"],link:"https://routine.vn/p/art-book",
  b:[["The idea","A styling quiz on routine.vn that helps women find the Routine pieces that suit them, art-directed like an art book."],["What I did","Designed the five-step journey, a 10-question quiz and the result pages for desktop and mobile."],["Outcome","Live now: 5 body shapes x 4 colour palettes lead to 20 Style Matches with product picks."]]},
 {n:10,t:"Website UI/UX Audit",who:"for Routine",g:"routine",st:"Audit · partly implemented",imgs:4,sk:["ux","data"],
  b:[["The problem","Buying one item took four steps, filters were unlabelled icons, and colours were flat swatches."],["What I did","Audited nine touchpoints against Uniqlo and Coolmate, then mocked up a fix for each friction point."],["Outcome","Implemented: Buy Now button, fabric-photo swatches, filter drawer. Search, wishlist and support are still proposals."]]},
 {n:11,t:"Graphic Tee Research",who:"for Routine",g:"routine",st:"Research & concept proposal",imgs:4,sk:["research","data"],

function openWin(id,opts){
  opts=opts||{};var a=APPS[id],w=open[id];
  if(!w){
    w=el("section","win");w.dataset.id=id;w.setAttribute("aria-label",a.label);
    w.style.setProperty("--win",a.color);if(a.ink)w.style.setProperty("--barink",a.ink);
    var bar=el("div","bar",'<h2></h2><button aria-label="Close '+a.label+'">x</button>');
    var body=el("div","body");body.id="body-"+id;w.appendChild(bar);w.appendChild(body);
    var W=window.innerWidth,H=window.innerHeight-64;
    w.style.width=Math.min(a.w,W-16)+"px";
    w.style.left=Math.max(8,Math.min(W-Math.min(a.w,W-16)-8,W*a.x+(opts.dx||0)))+"px";
    w.style.top=Math.max(8,H*a.y)+"px";
    bar.querySelector("button").onclick=function(e){e.stopPropagation();closeWin(id)};
    drag(w,bar);w.addEventListener("pointerdown",function(){focus(id)});
    wins.appendChild(w);open[id]=w;
  }
  w.querySelector(".bar h2").textContent=id==="view"?"project_"+state.proj+".show":a.title;
  RENDER[id]($("#body-"+id));
  focus(id);return w;
}
function closeWin(id){var w=open[id];if(!w)return;delete open[id];w.classList.add("closing");setTimeout(function(){w.remove()},190);paintTabs()}
function drag(w,bar){
  var sx,sy,ox,oy,on=false;
  bar.addEventListener("pointerdown",function(e){if(e.target.closest("button")||small())return;on=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener("pointermove",function(e){if(!on)return;var x=ox+e.clientX-sx,y=oy+e.clientY-sy;
    w.style.left=Math.max(-w.offsetWidth+90,Math.min(window.innerWidth-90,x))+"px";w.style.top=Math.max(0,Math.min(window.innerHeight-64-44,y))+"px"});
  var end=function(){on=false};bar.addEventListener("pointerup",end);bar.addEventListener("pointercancel",end);
}
